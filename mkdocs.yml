      - 6. Card Sorting e inventario de contenidos: up01/07-card-sorting-e-inventario-de-contenidos.md
      - 7. El diagrama jerárquico: up01/08-el-diagrama-jerarquico.md
      - 8. Mapa de navegación: up01/09-mapa-navegacion.md
      - 9. Fundamentos del diseño visual aplicado a interfaces Web: up01/10-fundamentos-del-diseno-visual-aplicado-a-interfaces-web.md
