INHERIT: mkdocs.yml

plugins:
  - search:
      lang: es

  - print-site:
      add_to_navigation: true
      print_page_title: "Versión imprimible de la UP02"
      print_page_basename: "imprimir-up02"

      add_table_of_contents: true
