      - 3. Selectores CSS: up02/04-selectores-css.md
      - 4. Cascada, herencia y especificidad: up02/05-cascada-herencia-especificidad.md
      - 5. Unidades, color y tipografía: up02/06-unidades-color-tipografia.md
      - 6. Modelo de caja: up02/07-modelo-de-caja.md
      - 7. Componentes reutilizables: up02/08-componentes-reutilizables.md
      - 8. Inspección y validación: up02/09-inspeccion-y-validacion.md

extra:
  generator: false

  pdf:
    modulo: "Diseño de Interfaces Web"
    codigo_up: "UP02"
    titulo_up: "CSS, selectores y estilos homogéneos"
